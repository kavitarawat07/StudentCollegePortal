<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="main-div border" style="margin: 40px; padding: 30px">
      <h2 style="text-align: center">Login</h2>
      <form style="margin: 16px">
        <div class="form-group">
          <label for="email"
            >Email Address <span class="required">*</span></label
          >
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="Email"
          />
        </div>

        <div class="form-group">
          <label for="password">Password <span class="required">*</span></label>
          <div class="password-box">
            <input
              type="password"
              id="password"
              name="password"
              required
              placeholder="Password"
            />
            <i class="fa-solid fa-eye"></i>
          </div>
        </div>

        <div style="display: flex; gap: 15px; margin: 10px 20px">
          <button class="btn-submit">Submit</button>
        </div>
        <p style="margin-top: 20px; text-align: center; font-size: 13px">
          Not Registered yet?
          <a href="registration.html" style="text-decoration: underline"
            >Register</a
          >
        </p>
      </form>
    </div>
  </body>
</html>
