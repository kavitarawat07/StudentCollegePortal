<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration html</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="main-div border" style="margin: 40px; padding: 30px">
      <h1>Registration Form</h1>
      <form style="margin: 16px">
        <div class="form-group">
          <label for="fullname"
            >Full Name <span class="required">*</span></label
          >
          <input
            type="text"
            id="fullname"
            name="fullname"
            required
            placeholder="Full Name"
          />
        </div>

        <div class="form-group">
          <label for="email"
            >Email Address <span class="required">*</span></label
          >
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="Email"
          />
        </div>

        <div class="form-group">
          <label for="password">Password <span class="required">*</span></label>
          <div class="password-box">
            <input
              type="password"
              id="password"
              name="password"
              required
              placeholder="Password"
            />
            <i class="fa-solid fa-eye"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number (Optional)</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Phone number"
          />
        </div>
        <div class="form-group">
          <label for="age">Age <span class="required">*</span></label>
          <input
            type="number"
            max="2"
            id="age"
            name="age"
            required
            placeholder="Age"
          />
        </div>
        <div class="form-group">
          <label for="dob">Date Of Birth <span class="required">*</span></label>

          <input
            type="date"
            id="dob"
            name="dob"
            required
            placeholder="dd-mm-yyyy"
          />
        </div>

        <label class="radiolabel"
          >Choose your gender: <span class="required">*</span></label
        >

        <div class="radio-group hobbies">
          <label>
            <input type="radio" name="gender" value="female" />
            Female
          </label>

          <label>
            <input type="radio" name="gender" value="male" />
            Male
          </label>
          <label>
            <input type="radio" name="gender" value="male" />
            Others
          </label>
        </div>

        <label class="radiolabel" for="state"
          >Course <span class="required">*</span></label
        >

        <select name="course" class="state">
          <option value="">Select Course</option>
          <option value="bba">BBA</option>
          <option value="bca">BCA</option>
          <option value="mba">MBA</option>
          <option value="mca">MCA</option>
        </select>
        <label class="radiolabel">Skills <span class="required">*</span></label>

        <div class="radio-group">
          <label
            ><input type="checkbox" name="hobby" value="reading" />
            Android</label
          >
          <label
            ><input type="checkbox" name="hobby" value="cooking" /> Web
            Development</label
          >
          <label
            ><input type="checkbox" name="hobby" value="traveling" />
            Python</label
          >
          <label
            ><input type="checkbox" name="hobby" value="music" /> Java</label
          >
          <label
            ><input type="checkbox" name="hobby" value="music" /> Others</label
          >
        </div>
        <div class="form-group">
          <label for="address">Address <span class="required">*</span></label>
          <textarea
            type="address"
            id="address"
            name="address"
            placeholder="Address"
          ></textarea>
        </div>
        <div class="form-group">
          <label for="city">City</label>
          <input type="text" id="city" name="city" placeholder="City" />
        </div>
        <label class="radiolabel" for="state"
          >State <span class="required">*</span></label
        >
        <select name="city" class="state">
          <option value="">Select State</option>
          <option value="uk">Uttrakhand</option>
          <option value="jk">Jammu &amp; Kashmir</option>
          <option value="hp">Himanchal Pradesh</option>
          <option value="hr">Haryana</option>
        </select>
        <label class="radiolabel">Upload Resume</label>
        <div class="form-group">
          <input type="file" id="file" name="file" />
        </div>
        <div style="display: flex; gap: 15px; margin: 10px 20px">
          <button class="btn-submit">Submit</button>
          <button type="reset" class="btn-reset">Reset</button>
        </div>
        <p style="margin-top: 20px; text-align: center; font-size: 13px">
          Already have an account?
          <a href="login.html" style="text-decoration: underline">Login</a>
        </p>
      </form>
    </div>
  </body>
</html>
